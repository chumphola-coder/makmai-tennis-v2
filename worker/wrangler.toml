name = "makmai-line-auth"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret vars can live here. Secrets (LINE secret + Firebase key) must be set with:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put FIREBASE_SA_PRIVATE_KEY
[vars]
LINE_CHANNEL_ID = "REPLACE_WITH_LINE_LOGIN_CHANNEL_ID"
FIREBASE_SA_EMAIL = "firebase-adminsdk-fbsvc@makmai-tennis-v2.iam.gserviceaccount.com"
ALLOWED_ORIGIN = "https://chumphola-coder.github.io"

